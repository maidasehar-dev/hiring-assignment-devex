name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./deployment-insights
        run: npm install

      - name: Run tests
        working-directory: ./deployment-insights
        run: npm test

      - name: Build Docker image
        working-directory: ./deployment-insights
        run: docker build -t deployment-insights .